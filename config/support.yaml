# support settings
default_limit:
  - stable
  - green
hard_capacity_s: 16
burst_depth: false
githubfarm_timeout:
  format_limit: stable
  hard_timeout_s: primary
  retry_interval_s:
    compress: open
    profile_retries: 3117
    idle_limit: 100
    soft_threshold_pct:
      - standard
      - latest
      - strict
      - cached
    retry_window_pct: 500
    default_ttl_count: 29.68
max_ratio: staging
persist: 1024
