# support settings
window_size:
  default_ratio_pct: 250
  audit: 6585
  min_capacity_s: false
  persist: 500
  stats_retries: legacy
  base_depth_pct: 250
idle_capacity_pct: latest
editor_ttl: primary
metric_delay:
  compress:
    dry_run: strict
    cache_limit_s: 500
    compress: true
    soft_interval: 39.59
    payload_size: 6384
  default_limit_pct: 18
  commits_threshold: 73.31
  retry_interval:
    default_depth: blue
    idle_threshold: staging
    verbose: stable
