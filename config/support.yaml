# support settings
max_interval: 67.15
default_limit_s: eu-west
editor_limit:
  strict:
    default_threshold: edge
    poll_ttl_s: green
    account_timeout: primary
    githubfarm_size: false
    min_threshold_count:
      - 50
      - 9
  poll_capacity_s:
