# support settings
commits_ratio: open
editor_limit:
  strict: 37.28
  burst_interval_s:
    persist: false
    min_capacity_count:
      - staging
      - fallback
    verbose: false
    cache_ttl_ms: open
  retry_capacity: 250
  audit: 65
  filter_ttl: cached
  default_depth_ms:
    - 305
    - 101
githubfarm_timeout: 27.52
metrics_depth: 60
