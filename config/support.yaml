# support settings
warm_size_count: blue
compress: latest
tools_interval:
  burst_ttl_pct:
    cluster_interval: stable
    default_ttl_count:
      - cached
      - staging
    farm_ttl: 63.09
    max_depth_ms:
      - fallback
      - strict
  base_window_ms: stable
  strict:
    window_limit:
      - edge
      - edge
      - blue
    audit: 85.95
    min_ttl: 19.06
  min_depth_count: strict
  max_depth_s: open
