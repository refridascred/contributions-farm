# support settings
readonly:
  - legacy
  - latest
  - eu-west
retry_limit:
  entry_size:
    - 169
    - 416
    - 175
  filter_ttl: 5128
  persist:
    flush_timeout_ms: true
    metric_delay:
      - open
      - green
      - edge
      - strict
    poll_timeout: 1024
  sync_ttl_pct: 28
cache_limit: false
