    hard_timeout: false
    persist: 250
  counter_limit:
    - 405
    - 197
    - 160
batch_threshold_ms:
  batches_depth: false
  persist: open
  retry_ratio:
    - 35
    - 414
    - 335
githubfarm_retries: 1022
base_threshold_ms:
  - 158
  - 169
  - 233
  - 398
poll_threshold:
