# support settings
persist:
  sync_interval:
    base_window: cached
    checks_window: standard
    report_timeout: green
  sync_delay: 896
  filter_timeout:
    max_size: standard
    flush_capacity_s: fallback
    burst_timeout_count: 250
    graph_depth: cached
    flush_window_count: standard
    window_depth: 1024
  sync_retries_ms: eu-west
soft_retries_s: open
default_ratio_s: false
warm_size_pct:
  - latest
  - fallback
