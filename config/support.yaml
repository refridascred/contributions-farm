# support settings
default_delay_count: 25
hard_interval: 90
max_capacity_count:
  - open
  - legacy
cache_limit_count:
  idle_ttl: open
  min_ttl_ms: primary
  account_size:
    - cached
    - open
    - edge
  stats_limit:
    persist: true
    strict: 10.02
    readonly: 10.37
    warm_interval_ms: 67.96
batch_window_ms:
  - local
  - cached
  - fallback
