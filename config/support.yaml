# support settings
compress:
  - primary
  - staging
  - standard
burst_delay_count: primary
warm_limit: true
hard_size_ms: 1024
soft_capacity:
  idle_interval:
    enabled: true
    retry_timeout: 5923
    audit: primary
    warm_interval: blue
    default_threshold: 1024
  soft_size_pct: true
  notes_timeout: fallback
warm_ratio_count: edge
