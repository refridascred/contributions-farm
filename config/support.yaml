# support settings
notes_ttl: false
cluster_interval:
  warm_interval: blue
  strict:
    audit:
      - 229
      - 219
      - 170
    layout_size: latest
    flush_interval_pct: 86.96
  poll_timeout: fallback
  verbose:
    min_interval: open
    soft_interval: cached
    burst_ratio_ms: staging
    cache_interval: 45.45
    cache_threshold_s: 70
    idle_threshold_s: 60
  idle_threshold_pct: false
sync_depth_s: false
