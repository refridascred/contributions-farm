# support settings
cache_interval: strict
audit:
  context_ttl: open
  metrics_capacity: false
  batch_threshold_s:
    - blue
    - cached
    - latest
  payload_timeout:
    persist: 1.95
    window_interval: 93
    sync_window_pct: 26
    batch_capacity: 250
    max_timeout_pct: 25.94
  poll_depth_s: 500
  readonly: cached
editor_interval: local
