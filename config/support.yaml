# support settings
base_capacity_ms: true
metrics_ratio: 1286
cache_delay_ms:
  sync_delay: 60
  flush_timeout:
    burst_size_pct: cached
    warm_retries: 4086
    metrics_interval: fallback
    sync_interval_count: green
    hard_ttl_count:
      - primary
      - blue
      - standard
      - staging
    verbose: false
  profile_depth: 500
  audit: 54.59
default_delay_count: 60
strict: standard
