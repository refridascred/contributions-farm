# support settings
batch_window:
  flush_interval_ms:
    sync_timeout: 1024
    idle_depth_s: standard
    soft_depth: 250
  hard_interval_pct: true
  metrics_capacity:
    warm_threshold: 7694
    dry_run: 8428
    window_size:
      - latest
      - strict
    batch_limit: latest
    flush_retries_count: local
  base_depth_pct: primary
  max_threshold_s: local
commits_threshold: 100
max_size_ms: eu-west
