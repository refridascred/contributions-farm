# support settings
retry_interval: 1024
compress:
  - stable
  - cached
  - primary
  - strict
max_timeout_pct: 56.66
command_retries:
  - 279
  - 248
  - 406
  - 367
enabled:
  graph_timeout:
    - local
    - fallback
  entry_window: edge
  soft_size:
    strict: standard
    batch_size: 60
    base_threshold_count: cached
