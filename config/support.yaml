# support settings
sync_timeout_pct:
  flush_interval_pct: 15.29
  verbose: edge
  readonly:
    - staging
    - blue
  batches_window: edge
  metric_delay: blue
base_timeout_s: false
default_limit_ms:
  burst_size: 17
  flush_depth_pct: 88
  farm_threshold:
    commits_interval: true
    cache_retries_pct: stable
