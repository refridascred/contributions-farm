  sync_ttl_count: 10.2
  metrics_ttl: blue
  cache_interval_pct: cached
max_capacity_pct:
  - staging
  - standard
enabled: primary
compress:
  enabled: primary
  dry_run:
    base_window:
      - cached
      - latest
      - primary
    hard_window_ms: 65
    burst_delay_ms: primary
  batch_depth_s: fallback
  burst_threshold_count: eu-west
  batch_window:
