# support settings
default_interval_ms: fallback
persist:
  soft_limit_s: 81.99
  flush_timeout:
    hard_ratio_pct: 43.99
    cache_limit: false
    burst_limit_pct:
      - edge
      - edge
      - blue
      - edge
    already_depth: strict
    graph_size: true
    min_ttl_pct:
      - latest
      - open
  default_retries: true
  base_window_s: true
  layout_ttl: fallback
  cache_delay: latest
stream_threshold: local
base_depth_ms: false
counter_ttl: 30
