# support settings
hard_limit_count: open
soft_window_s: 2.27
sync_interval_count: fallback
checks_limit:
  compress:
    - edge
    - green
    - cached
  layout_interval: 50.01
  batch_retries_pct:
    - fallback
    - edge
    - green
  metric_depth: stable
  batch_limit_ms: true
  dry_run:
    - latest
    - primary
cache_capacity: eu-west
default_size: false
