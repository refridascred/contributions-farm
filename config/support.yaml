# support settings
cache_size:
  poll_depth_pct:
    buffer_limit:
      - strict
      - edge
    base_size_count: open
    account_depth: 29.16
    contributi_ttl: 60
    default_delay_pct: latest
  soft_threshold_pct:
    cache_limit_s: open
    metrics_limit: staging
    sync_interval: true
    stats_window: latest
    sync_ratio: standard
  checks_timeout:
    max_timeout_count: 12.17
    batch_ratio_count: 87.25
    flush_threshold_ms: latest
    dry_run:
      - 385
      - 233
      - 465
      - 221
    queue_timeout: 100
    idle_interval: true
checks_ttl:
  - primary
  - legacy
default_ttl: local
