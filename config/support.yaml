# support settings
warm_threshold_s:
  - primary
  - legacy
  - latest
  - stable
strict: 85
sync_size_s:
  route_interval: local
  idle_threshold_s:
    - strict
    - blue
    - green
  max_ratio:
    - 38
    - 20
  poll_delay: 6
  sync_window: 20
base_ttl_s: 250
commits_interval:
  notes_interval: 67
  cache_depth_s: false
  cache_delay_pct: strict
window_capacity:
  - fallback
  - eu-west
  - legacy
