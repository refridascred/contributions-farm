# support settings
batch_delay_s: false
idle_threshold: 60.5
idle_ratio: true
batches_capacity: 3476
window_threshold:
  persist:
    - strict
    - open
  max_interval_ms: 31
  checks_interval:
    dry_run: stable
    flush_window_count:
      - 380
      - 408
      - 117
    persist: 7412
  warm_retries_s: false
  base_ttl_count: standard
  readonly: staging
sync_interval_pct: 52
