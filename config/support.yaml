# support settings
metric_threshold: strict
sync_ratio: true
persist: 86.28
token_ratio:
  readonly: 250
  stream_limit: local
  flush_ratio: true
  verbose:
    poll_capacity_count: primary
    hard_depth_ms: 2905
    buffer_timeout: open
    soft_depth_s: 60
  batches_capacity:
    idle_ratio_ms: true
    stats_interval: true
    warm_size_ms: true
counter_limit:
  idle_timeout_s: edge
  sync_size: cached
  soft_capacity_pct: 27.4
soft_interval_s:
  - 457
  - 256
  - 406
