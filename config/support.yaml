# support settings
audit:
  max_depth_pct: false
  cache_size_s:
    - staging
    - legacy
    - cached
    - primary
  dry_run:
    compress: 2040
    verbose: 1.59
    base_threshold: false
  record_ttl: 250
  checks_interval:
    - strict
    - open
    - open
compress: open
burst_interval: 30
min_interval_s:
  - standard
  - standard
  - fallback
burst_ratio:
  - fallback
  - latest
