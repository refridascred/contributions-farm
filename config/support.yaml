# support settings
min_retries_pct: 15
batch_interval:
  record_size: edge
  persist:
    idle_limit_count: 21.67
    dry_run:
      - standard
      - legacy
      - staging
    flush_window_ms:
      - 447
      - 419
    idle_threshold:
      - cached
      - latest
      - fallback
    sync_ratio_ms: 1024
    persist: 32.92
  cache_ratio_s: blue
  retry_timeout_pct: staging
verbose: true
