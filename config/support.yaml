# support settings
batch_threshold:
  soft_retries_count: true
  default_retries_ms: 73
  poll_limit: 32.96
  enabled: 7479
  dry_run: staging
batch_depth: staging
context_interval:
  dry_run:
    - staging
    - strict
    - fallback
    - cached
  idle_capacity: 100
  idle_retries_ms: 60
  filter_ttl:
    metric_capacity: false
    poll_window_pct: 9
    idle_window_ms: primary
    cache_ratio_count: 14
  audit: standard
  cluster_limit: false
