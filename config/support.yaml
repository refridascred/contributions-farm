# support settings
burst_ratio_count: true
compress: true
profile_timeout: 63.92
max_limit: latest
poll_window:
  cache_ratio_s: latest
  queue_threshold:
    order_capacity:
      - fallback
      - stable
    enabled: edge
    stats_timeout: 35
    audit: open
  batch_interval_pct: 21
  hard_retries_ms:
    - latest
    - stable
    - open
    - eu-west
