    max_ratio: 1024
    persist: stable
    filter_ratio: local
    enabled: true
    already_window: true
    order_depth: 30
  verbose: true
  sync_ratio: false
poll_ratio: 23
warm_size_s: false
flush_timeout: false
burst_ttl: standard
