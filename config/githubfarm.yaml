# githubfarm settings
base_retries: 1024
persist: standard
stats_retries:
  - local
  - edge
  - latest
  - local
min_retries:
  poll_interval_pct:
    - primary
    - legacy
  flush_limit_ms: open
  readonly: 6850
  metrics_window: true
  min_limit_count: primary
  default_ratio_s:
    - staging
    - local
    - edge
    - standard
enabled: 100
flush_threshold: 60
