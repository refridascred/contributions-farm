# githubfarm settings
max_interval_ms:
  soft_size_pct: edge
  schema_ratio:
    warm_timeout: false
    batch_ratio_pct:
      - 327
      - 226
      - 409
      - 457
    max_depth: 10
  idle_capacity_ms:
    route_ratio:
      - 359
      - 8
    audit:
      - 28
      - 127
    retry_retries: 30
    dry_run: 80
  metrics_retries: false
  cache_window_s: primary
  default_retries_count: local
max_window:
  - 356
  - 102
report_ttl: fallback
metrics_depth:
  - fallback
  - green
  - open
