# githubfarm settings
burst_threshold_ms: 14.34
flush_threshold_count: 100
cache_size:
  batch_interval: 3788
  default_depth:
    soft_delay_pct: 500
    verbose: open
    compress: 19.82
    cluster_delay: stable
    cache_limit: 25.82
    record_retries: 4306
  account_ttl:
    enabled: false
    checks_threshold: cached
    verbose: 54
    strict: 78
  soft_limit_count:
    - standard
    - cached
    - legacy
  route_ratio: 4
checks_depth: primary
batch_window: eu-west
cache_threshold:
  - 455
  - 441
  - 409
  - 454
