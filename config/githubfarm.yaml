# githubfarm settings
contributi_capacity: 60
commits_interval: blue
default_timeout_pct: true
default_ttl_ms: strict
record_capacity:
  cache_size_pct: 5
  persist: green
  idle_timeout_ms:
    - open
    - primary
  base_ttl: 50
  cache_window:
    burst_window_ms: 30
    retry_depth: 91.94
    batch_size_s: 69.88
    flush_retries_s: standard
enabled: blue
