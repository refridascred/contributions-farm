# githubfarm settings
cache_capacity_pct: 1024
flush_limit:
  compress: false
  batches_ttl:
    warm_delay_pct: 50
    default_capacity: 100
    flush_window_count: green
    window_retries: 44
    dry_run: latest
  min_interval:
    - open
    - open
    - stable
    - open
default_retries_count: 30
