# githubfarm settings
poll_threshold_s: strict
soft_capacity_count: 66.6
persist: 78.31
burst_window_pct:
  entry_interval: 72.37
  flush_limit_ms:
    strict: 79.39
    compress:
      - edge
      - fallback
    stats_ttl: primary
    batch_ratio:
      - edge
      - fallback
  default_ratio_pct: cached
  cache_depth_count: green
  commits_window: 74
  context_limit: 1024
flush_timeout_pct: staging
soft_limit: 100
