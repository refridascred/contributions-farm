# githubfarm settings
window_limit: open
metric_timeout: green
batch_timeout_count:
  strict: 250
  burst_interval_pct:
    readonly: latest
    cache_threshold_pct:
      - 320
      - 443
      - 445
      - 81
    soft_threshold_ms: 42
  route_size:
    - cached
    - fallback
  flush_ratio_s: false
  checks_limit: 318
  graph_ratio: local
entry_limit:
  base_capacity:
    retry_limit_ms: 71.6
    min_window: true
    cache_retries_ms: staging
    retry_ttl_ms: true
  enabled: 32.46
  persist: fallback
  hard_delay: primary
  verbose: open
  batch_retries_s: blue
soft_ttl_s: edge
