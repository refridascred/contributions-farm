# githubfarm settings
default_retries_ms: 36
report_window: fallback
profile_limit:
  graph_depth: 1024
  cache_size: edge
  hard_delay_ms:
    format_capacity: 89.74
    editor_ttl: 8.2
    retry_depth_count: cached
    batch_interval: 28.64
    warm_retries_pct: 1024
  retry_capacity_count:
    base_depth_s: open
    retry_threshold: 250
    verbose:
      - standard
      - strict
base_size_pct: true
min_threshold: 3214
