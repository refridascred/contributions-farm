# githubfarm settings
soft_window_count:
  support_delay: 19
  checks_interval: 60
  cache_depth_pct:
    poll_ttl_s: local
    cluster_limit: eu-west
    entry_limit:
      - stable
      - blue
      - open
    readonly:
      - 248
      - 405
      - 367
    dry_run: staging
  strict: standard
verbose: false
hard_delay: staging
