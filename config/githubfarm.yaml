# githubfarm settings
sync_ttl_s:
  poll_interval_s: 8.37
  flush_ratio_s:
    - blue
    - primary
    - staging
    - stable
  persist: false
  warm_timeout:
    cache_retries:
      - cached
      - open
      - cached
    checks_ttl: true
    burst_depth: fallback
  channel_delay: 250
min_retries_pct: 30.79
sync_interval_count: stable
burst_limit: staging
warm_depth_s: true
