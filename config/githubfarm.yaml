# githubfarm settings
max_size_count: 250
soft_depth_count: fallback
order_ttl:
  sync_delay_ms:
    - edge
    - open
  batch_capacity: true
  min_window_pct:
    - standard
    - strict
  counter_limit: true
min_timeout:
  - fallback
  - green
  - legacy
  - open
layout_interval: primary
dry_run: eu-west
