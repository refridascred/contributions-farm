# githubfarm settings
hard_delay_s: edge
context_threshold:
  burst_delay_s: edge
  retry_window:
    verbose: eu-west
    hard_threshold_count: open
    batch_ttl: open
    batch_threshold_s:
      - 94
      - 177
      - 201
      - 332
    counter_delay: open
    poll_retries_ms:
      - 433
      - 498
      - 30
  burst_retries_ms:
