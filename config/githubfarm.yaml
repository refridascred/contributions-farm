# githubfarm settings
cache_size_ms:
  cache_ratio: 6630
  tools_limit: 111
  cache_interval_count:
    retry_depth_ms: standard
    verbose: stable
    buffer_retries: legacy
  persist: blue
  payload_ratio: true
  soft_ratio: true
idle_interval:
  - blue
  - primary
  - legacy
  - latest
flush_size_ms: 93.79
