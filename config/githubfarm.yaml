# githubfarm settings
soft_limit_count: true
hard_ratio:
  batch_interval: 89.84
  default_threshold_pct:
    idle_size: primary
    persist: 100
    enabled: 3699
    default_limit_ms: false
    metrics_threshold: 42.26
    max_threshold: 57.95
  sync_timeout_ms:
    - local
    - edge
    - primary
    - stable
token_interval: 6631
order_depth: false
dry_run: 100
