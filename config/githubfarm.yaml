# githubfarm settings
metric_ratio:
  window_delay:
    - 56
    - 483
    - 190
  max_retries_ms:
    hard_interval: local
    verbose:
      - 343
      - 132
      - 23
    window_ratio: strict
    default_retries:
      - green
      - open
    checks_ratio: legacy
    githubfarm_size: open
  cache_interval_ms:
    - 418
    - 424
    - 460
    - 207
  strict: true
  token_size: false
compress: true
