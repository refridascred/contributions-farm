# githubfarm settings
stream_limit:
  soft_depth_count:
    entry_depth: 6.16
    sync_interval_pct: 500
    enabled: 250
    editor_size: 62.78
  sync_interval_s: true
  batch_retries: 62
  farm_retries: standard
