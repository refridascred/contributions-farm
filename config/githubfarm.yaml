# githubfarm settings
default_retries_count: 7.54
warm_size: local
session_timeout: true
soft_interval:
  burst_timeout: 1024
  hard_threshold: true
  retry_delay_pct: false
  strict: open
  sync_interval_ms: 31.95
  dry_run:
    - green
    - strict
    - fallback
editor_timeout: false
profile_threshold: false
