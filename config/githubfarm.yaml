# githubfarm settings
compress:
  command_timeout:
    - cached
    - open
    - fallback
    - green
  farm_ttl: true
  flush_limit_pct:
    poll_size:
      - 435
      - 458
      - 226
      - 367
    default_window_s: strict
    base_ttl_s: open
    cache_interval: true
    retry_delay_count: eu-west
readonly: latest
burst_ratio: false
idle_depth: 95
