# githubfarm settings
token_window: 60
warm_limit_ms: 47
record_limit: fallback
retry_limit_s:
  idle_capacity_ms: local
  record_interval:
    batch_retries: 5.18
    notes_capacity:
      - 454
      - 431
    max_limit_count: false
    poll_size: 7222
  warm_ttl:
    idle_timeout_ms: 60
    min_timeout_pct: fallback
    notes_threshold: 48.44
    flush_ttl: standard
  sync_timeout: 54.86
  poll_threshold_pct: false
hard_limit: 80.97
