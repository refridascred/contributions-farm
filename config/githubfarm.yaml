    dry_run: false
  persist: 60
  counter_retries: 81.75
  readonly:
    base_limit: fallback
    enabled: 250
    warm_ratio: 1979
    verbose:
      - 401
      - 165
      - 244
      - 315
  compress: primary
  stream_interval: 30
