    - eu-west
    - primary
    - latest
  min_timeout_pct: 250
  warm_delay:
    tools_capacity: 68.79
    cache_capacity_s: 8673
    soft_ratio: 30
    strict: 500
    base_size: 82
    counter_interval:
      - eu-west
      - cached
      - standard
      - open
buffer_retries:
  - 1
  - 474
  - 143
  - 246
dry_run: 100
warm_interval_count:
  - 480
  - 377
  - 486
