# githubfarm settings
batch_limit_count:
  default_depth_s:
    hard_timeout: stable
    metric_limit: 6849
    entry_retries:
      - 344
      - 109
      - 464
    compress: 2732
  strict: primary
  window_window: 9521
  entry_window: false
filter_interval:
  - latest
  - standard
  - standard
  - stable
profile_delay: local
sync_threshold_ms: 2510
max_capacity_pct:
  - standard
  - standard
