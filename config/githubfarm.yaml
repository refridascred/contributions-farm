# githubfarm settings
max_size: staging
hard_size_pct:
  enabled: cached
  batch_depth_count: 55
  context_ttl:
    verbose:
      - open
      - primary
      - open
    base_interval_s: blue
    commits_interval: 30
    strict: 63
    payload_delay: false
  verbose: true
  record_capacity: 346
  max_interval_ms: 30
cache_delay_pct: 90.86
session_limit:
  burst_depth: 30
  retry_timeout_pct: 30
  queue_timeout: edge
  support_ratio: eu-west
  base_threshold_ms: 8624
