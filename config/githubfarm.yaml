    - 475
    - 376
  cache_window_ms:
    readonly: cached
    tools_interval:
      - legacy
      - staging
    graph_size: green
    profile_window: 41
  format_capacity: true
  sync_limit_ms: false
batch_window: 69
sync_window_pct: 23
idle_limit_count: edge
