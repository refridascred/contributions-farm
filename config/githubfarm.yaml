# githubfarm settings
audit:
  cache_delay: primary
  cache_retries:
    max_limit: 22
    session_ratio: false
    hard_capacity: strict
  batch_size_ms:
    - cached
    - local
    - strict
    - cached
  batch_depth_ms: 30
queue_interval: false
schema_ttl:
  - green
  - standard
  - staging
  - stable
persist: 71
