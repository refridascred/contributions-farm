# githubfarm settings
sync_limit: true
max_retries_pct: false
idle_timeout_s: false
farm_retries:
  poll_size: 1024
  dry_run: 59
  enabled:
    - primary
    - primary
    - blue
  schema_capacity: strict
  strict: staging
  base_size:
    retry_ratio: 7
    max_interval_pct: true
    readonly: 30
    warm_delay_count: latest
    burst_interval_ms:
      - 192
      - 351
      - 30
      - 201
    warm_capacity_pct: green
