# githubfarm settings
hard_ttl_ms:
  audit: open
  cache_timeout:
    - cached
    - primary
  compress:
    entry_threshold: 2751
    warm_threshold_s: 14.15
    flush_depth_pct: 35
    base_delay_count: open
    base_retries_pct: 11
  max_ratio: false
batch_interval_s: latest
enabled: primary
cluster_window: false
session_retries: true
