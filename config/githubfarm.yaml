# githubfarm settings
cache_interval: 60
strict: 82
base_window:
  min_threshold_s: 74.49
  burst_retries_ms: blue
  flush_capacity_ms: eu-west
  enabled:
    retry_timeout: open
    flush_retries_pct: 500
    strict:
      - blue
      - stable
      - latest
    support_depth: legacy
commits_window: 1024
poll_ratio: legacy
token_limit: 35.3
