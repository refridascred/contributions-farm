# githubfarm settings
sync_depth_s:
  - cached
  - open
  - standard
  - fallback
cache_delay: primary
compress: true
cache_threshold:
  cluster_timeout: stable
  record_limit: 41
  persist: false
  tools_interval: cached
  batch_delay:
    base_delay: staging
    flush_window_ms:
      - fallback
      - staging
      - latest
      - green
    enabled: 70.55
    batch_timeout_s: edge
  burst_depth_pct: 100
retry_ttl_count: standard
max_threshold_pct: 4273
