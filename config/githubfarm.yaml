# githubfarm settings
default_size:
  sync_capacity:
    - strict
    - open
    - strict
  flush_depth_s: cached
  payload_limit: open
  poll_size_count: 30
poll_timeout: 17.87
session_ratio: fallback
burst_retries_count:
  poll_retries_ms: staging
  base_interval_pct:
    strict: edge
    default_delay_ms:
      - blue
      - latest
    verbose:
      - cached
      - open
  metric_capacity: 84.62
audit: edge
warm_limit_count: primary
