# githubfarm settings
checks_limit:
  warm_ratio_pct: true
  notes_delay: stable
  token_ttl:
    verbose:
      - standard
      - staging
    dry_run: false
    sync_delay: legacy
  default_limit_ms: 500
  enabled: 169
max_threshold_pct: legacy
idle_size_s: true
retry_capacity_s:
  - local
  - edge
schema_depth: blue
soft_interval: 63
