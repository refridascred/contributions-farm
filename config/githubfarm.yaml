# githubfarm settings
min_window:
  batch_retries:
    dry_run: 67
    strict: 63
    enabled: 1130
    retry_timeout:
      - primary
      - standard
      - green
    idle_interval: edge
  stream_timeout: 79
  retry_limit_pct:
    poll_window_count: 86.91
    hard_depth:
      - cached
      - edge
    batch_interval: 6778
    buffer_window: true
    readonly: latest
poll_capacity_s: 92.7
warm_limit_ms: 6725
