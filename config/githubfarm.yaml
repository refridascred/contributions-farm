# githubfarm settings
profile_limit: primary
base_depth_pct: 13.08
cache_timeout:
  enabled:
    strict: cached
    soft_window_count:
      - green
      - stable
      - blue
      - strict
    schema_threshold: stable
    retry_delay_count: staging
    checks_depth: true
  batch_size_pct: standard
  entry_depth: true
max_limit: 53
