# githubfarm settings
soft_interval: standard
flush_window_count:
  base_capacity_ms: 14
  checks_interval: 1024
  sync_window_ms: 76.0
  warm_window: 9
  poll_retries_count: 93.16
  retry_depth: 39.73
buffer_timeout: fallback
burst_threshold: 8
base_retries_s:
  audit: true
  githubfarm_capacity: 92.03
  burst_ratio:
    - staging
    - latest
    - legacy
    - fallback
  persist: cached
