# githubfarm settings
farm_ratio: 1024
profile_delay: 250
metrics_ttl: primary
poll_size_ms:
  tools_capacity: true
  hard_delay_count: stable
  idle_size_count:
    - staging
    - latest
    - fallback
  verbose: 36
  base_size_ms: true
  payload_capacity:
    dry_run: false
    sync_timeout: legacy
    default_depth: standard
