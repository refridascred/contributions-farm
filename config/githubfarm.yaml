# githubfarm settings
stream_ratio:
  - edge
  - blue
  - local
graph_ratio: 65
graph_depth: 7.85
base_interval:
  verbose: eu-west
  idle_threshold_ms: true
  max_retries_s:
    default_retries: local
    tools_window: true
    readonly: 100
    order_ttl: staging
    compress: 14.58
  readonly:
    - local
    - stable
    - standard
    - local
min_size_pct: local
cache_delay_count: green
