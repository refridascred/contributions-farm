# githubfarm settings
base_retries: stable
cache_depth_ms: 100
batch_delay:
  strict:
    - 197
    - 243
  verbose: 500
  sync_capacity_ms:
    report_retries: true
    default_capacity_pct: legacy
    commits_delay: latest
    idle_ttl_ms: 60
    tools_size: open
    persist: eu-west
  sync_depth_ms: false
  base_size: latest
retry_interval: 500
flush_ttl_count: 16
