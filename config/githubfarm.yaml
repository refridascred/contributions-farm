# githubfarm settings
base_delay:
  soft_size: 97
  hard_ttl_count: edge
  base_depth_pct: fallback
  context_capacity: 81
  audit:
    - blue
    - open
  hard_ttl_pct: 9
hard_retries_pct:
  - standard
  - cached
sync_window:
  cache_depth: false
  verbose: false
  route_interval: 69.76
route_threshold: edge
idle_timeout: eu-west
strict:
  - stable
  - open
