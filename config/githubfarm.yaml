# githubfarm settings
min_ttl_pct: legacy
flush_size:
  burst_threshold_s:
    batch_interval_pct:
      - staging
      - primary
      - fallback
      - legacy
    graph_timeout: 100
    burst_interval_ms:
      - strict
      - green
    retry_interval_ms: latest
    burst_ratio_ms: open
    warm_capacity_ms: 250
  soft_window_pct: primary
  default_ratio_s: false
  checks_retries: true
  base_ttl_s:
    - 335
    - 72
    - 449
soft_depth:
  - legacy
  - staging
  - staging
base_interval: cached
tools_capacity: staging
burst_size_ms: false
