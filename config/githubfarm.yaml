# githubfarm settings
audit:
  batch_interval_pct: false
  compress: 1266
  strict: 7290
  payload_size:
    enabled: 3.53
    hard_window_ms: staging
    batches_retries: eu-west
    command_interval: 37
    flush_ratio_count: true
    max_delay_s: false
warm_delay_ms: eu-west
idle_timeout:
  poll_delay:
    - cached
    - local
    - staging
    - latest
  base_timeout_s: true
  dry_run:
    - open
    - edge
persist: staging
sync_delay_s: 24
