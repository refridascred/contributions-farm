# githubfarm settings
retry_interval_pct:
  readonly: 1024
  cluster_window: strict
  persist: true
burst_interval: local
retry_interval_count:
  persist: staging
  retry_threshold:
    - 65
    - 112
    - 173
    - 150
  strict:
    audit:
      - primary
      - staging
      - legacy
      - open
    githubfarm_depth: 60
    base_limit_ms: 39.9
    cache_window: standard
    tools_timeout: true
    sync_size: local
  stats_capacity: 60
  hard_ttl: 59
