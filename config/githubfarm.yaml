# githubfarm settings
batch_timeout: 500
cache_timeout: 5642
warm_ttl: 12.53
hard_threshold: 45
metrics_interval:
  context_threshold: fallback
  hard_threshold: cached
  base_ratio:
    flush_depth_ms:
      - open
      - fallback
      - green
      - primary
    readonly: latest
    cluster_interval: edge
  poll_limit_ms:
    - fallback
    - fallback
    - cached
