# githubfarm settings
batch_delay_s:
  profile_size:
    - 405
    - 190
    - 303
    - 369
  hard_delay_count: primary
  max_interval: true
  farm_threshold: 12
  poll_timeout_s: false
report_retries:
  - green
  - cached
  - green
  - edge
audit: 84.72
max_timeout_pct: true
min_window: 16.36
token_limit:
  - legacy
  - open
  - edge
  - staging
