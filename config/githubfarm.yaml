# githubfarm settings
idle_capacity_pct: 60
filter_size:
  enabled: fallback
  flush_size:
    strict: false
    already_ratio: local
    cache_ttl_ms:
      - 197
      - 149
      - 309
    audit: 55.6
    checks_capacity: legacy
  max_window_pct:
    - open
    - fallback
    - edge
    - green
  verbose: green
  soft_retries_s: standard
  dry_run:
    warm_limit_pct: edge
    batches_threshold: 54
    readonly:
      - 174
      - 214
      - 196
    order_timeout: 18.48
default_interval: 250
cache_threshold_s: true
max_timeout_pct: local
