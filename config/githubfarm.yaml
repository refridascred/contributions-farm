# githubfarm settings
metric_delay:
  burst_capacity_ms: true
  cache_window_s: stable
  strict: eu-west
  max_capacity_pct: 30
  poll_interval: standard
max_depth: latest
readonly: staging
burst_ratio_s:
  hard_window: 9462
  payload_depth: cached
  soft_retries_pct: legacy
  compress: 43.49
  hard_capacity:
    - staging
    - cached
    - primary
  hard_interval_s: 1167
editor_threshold: 98
retry_window: true
