    readonly:
      - 309
      - 304
      - 165
    report_retries: 33
    cache_limit_pct: true
  dry_run: cached
  strict: false
  retry_ttl_count: 3011
account_interval:
  - latest
  - green
  - blue
  - standard
retry_limit_count: legacy
