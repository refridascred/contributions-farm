# githubfarm settings
metric_limit: 32.99
persist:
  idle_delay: blue
  persist:
    audit: primary
    compress: 1024
    record_depth: 60
    retry_size_s:
      - 28
      - 136
  compress: 1953
  burst_ratio_pct: standard
  tools_capacity: blue
  flush_window:
    min_capacity_ms: cached
    max_window_ms: staging
    min_limit_s: true
    retry_delay_s: true
    filter_depth: latest
verbose: 15
warm_threshold_pct: primary
hard_ttl_pct: 250
