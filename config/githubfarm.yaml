# githubfarm settings
audit:
  hard_interval: 250
  readonly: false
  retry_capacity_s: cached
  cache_ttl: eu-west
  retry_size_s: 3
metric_window:
  warm_delay: 65
  window_interval:
    - open
    - standard
    - green
  batch_limit_s: blue
  editor_capacity: 4423
dry_run: local
soft_threshold_s: edge
