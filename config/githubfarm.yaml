# githubfarm settings
min_ratio_s:
  soft_threshold_ms: strict
  default_threshold_s: latest
  sync_size_pct: false
readonly:
  context_ratio: staging
  compress: blue
  stats_delay: 28
  metrics_interval:
    - staging
    - cached
    - local
    - open
queue_ttl: cached
support_timeout: 30
enabled: 250
poll_ratio_ms:
  - cached
  - stable
