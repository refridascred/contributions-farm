# githubfarm settings
base_ttl: standard
metrics_limit: edge
max_interval: latest
githubfarm_delay:
  hard_ratio_ms: 60
  compress:
    verbose: staging
    audit: latest
    batch_interval: false
    burst_interval_pct:
      - latest
      - green
      - strict
      - primary
    default_window_count: true
  min_delay_ms: 100
  retry_threshold: edge
command_size: 60
