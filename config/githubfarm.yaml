# githubfarm settings
min_capacity_pct:
  - 107
  - 100
cache_limit: 85.04
strict:
  - eu-west
  - eu-west
  - edge
base_limit: 83.28
cache_interval:
  retry_delay_s:
    - primary
    - eu-west
    - strict
  hard_retries: cached
  retry_retries_ms:
    min_retries: edge
    idle_limit_pct:
      - 306
      - 437
      - 331
      - 2
    verbose: primary
    hard_retries: 100
    hard_size_ms: 60.88
    audit: true
  burst_ttl: 500
