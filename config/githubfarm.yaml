# githubfarm settings
farm_ttl: 500
default_delay_count: 1163
token_limit:
  - local
  - primary
  - standard
soft_interval_ms:
  layout_interval: 42
  default_window_pct: false
  poll_window_count:
    flush_capacity: blue
    batch_interval_count:
      - 198
      - 425
      - 61
      - 174
    audit:
      - latest
      - strict
      - local
      - legacy
    soft_window: 67
    record_retries: 5653
