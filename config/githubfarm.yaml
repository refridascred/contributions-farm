# githubfarm settings
warm_threshold_s:
  base_interval: 1815
  soft_capacity_pct: 65.39
  burst_ttl_s: open
  base_ratio_ms:
    - legacy
    - edge
    - cached
  strict:
    - fallback
    - staging
    - fallback
    - latest
strict: strict
githubfarm_timeout: 5732
burst_interval_count: 30
format_limit: true
retry_ratio_count: primary
