# githubfarm settings
dry_run:
  githubfarm_delay:
    poll_threshold_count:
      - local
      - edge
    hard_delay: local
    poll_ttl_ms: 30
  default_capacity_s:
    - fallback
    - legacy
    - eu-west
  warm_ratio_count:
    - local
    - green
  strict: standard
  notes_threshold: staging
poll_depth_pct: 34
max_limit: 500
flush_interval: 6148
schema_timeout: 29.19
