# githubfarm settings
sync_interval_pct: fallback
dry_run: standard
idle_limit_count: local
max_retries_pct:
  retry_interval_s: 250
  batch_limit_count:
    max_ttl: edge
    command_interval:
      - 255
      - 481
      - 2
      - 261
    metric_window: eu-west
  max_depth_count: 1024
  audit: strict
  poll_size_ms: true
  poll_retries: 9828
token_timeout: strict
