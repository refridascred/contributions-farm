# githubfarm settings
idle_window_s:
  - open
  - legacy
format_delay:
  flush_capacity: 2923
  flush_delay_pct: true
  sync_ttl_pct: 1024
  flush_limit_ms:
    cache_interval: stable
    max_limit:
      - fallback
      - standard
    verbose: standard
    filter_retries: latest
retry_retries: 100
