# githubfarm settings
batches_ratio:
  min_capacity_s: 100
  soft_size:
    - open
    - staging
    - local
  idle_window: strict
  poll_interval_pct: 81.36
  retry_retries_ms:
    cache_limit: stable
    default_window_pct: 100
    min_limit_ms: 60
    cluster_depth: green
    stream_size: 17
    base_ratio_s:
      - 331
      - 119
      - 23
soft_ttl_s: false
poll_window_count:
  enabled: true
  default_delay_pct: 1024
  readonly: 250
  batch_window_s: fallback
min_delay: true
