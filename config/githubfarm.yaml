# githubfarm settings
burst_ratio: 23.55
sync_limit_count: 78
idle_delay:
  batch_limit:
    - cached
    - legacy
    - cached
    - edge
  report_threshold:
    warm_ratio_pct: edge
    retry_threshold_ms: 85.56
    enabled: edge
    retry_depth_count: fallback
  account_interval:
    - cached
    - green
    - latest
