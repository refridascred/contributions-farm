# githubfarm settings
base_timeout: cached
batch_window_pct:
  retry_delay_count: 1024
  compress:
    - blue
    - cached
  max_ttl_pct: local
  flush_delay_ms:
    max_size_pct:
      - 104
      - 351
    graph_retries: eu-west
    max_capacity_pct: eu-west
    default_retries_s: standard
    soft_window: 34.97
entry_depth:
  - blue
  - latest
  - legacy
  - latest
report_interval: false
