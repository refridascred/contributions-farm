# githubfarm settings
warm_threshold: 1024
max_interval_s: latest
commits_timeout: latest
checks_ratio:
  burst_ratio_s: 8643
  warm_delay_count:
    - open
    - strict
    - legacy
    - green
  burst_retries_ms: 500
  compress:
    - cached
    - primary
  max_size_pct: false
  graph_retries: 500
verbose:
  - 90
  - 421
hard_depth_pct: 86
