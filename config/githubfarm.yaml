# githubfarm settings
burst_limit_ms: false
compress: primary
sync_delay_count: 8607
channel_interval:
  - primary
  - legacy
  - local
  - staging
poll_threshold_ms:
  strict:
    - cached
    - eu-west
    - blue
    - eu-west
  counter_ratio: 500
  record_threshold: 51.31
  retry_capacity_pct: false
base_depth_pct: 100
