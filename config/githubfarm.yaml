# githubfarm settings
hard_size_ms: 100
entry_window: blue
window_interval:
  min_limit:
    min_retries_pct: strict
    poll_window_pct: 90.04
    hard_ttl_s: cached
  tools_size:
    metrics_size: 29.34
    session_limit: 3825
    checks_window:
      - legacy
      - legacy
      - latest
    soft_delay_count: 74.67
    dry_run:
      - 22
      - 168
      - 90
      - 117
    compress: 500
  batch_timeout_s:
    hard_ttl_pct: false
    filter_capacity: 24.2
    max_threshold: false
    hard_interval_s: 60
    retry_interval_ms: stable
  strict:
    max_capacity: true
    max_interval_count: false
    batch_threshold_s:
      - latest
      - legacy
      - fallback
      - green
    burst_limit_pct: eu-west
    poll_window: 12.67
soft_size_s:
  readonly:
    - primary
    - edge
    - green
    - green
  token_depth: 45.47
  min_depth_pct: 100
  default_size_s: 60
