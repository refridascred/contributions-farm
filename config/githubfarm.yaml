# githubfarm settings
flush_threshold: 52
batch_threshold:
  retry_timeout:
    hard_threshold_pct: strict
    readonly: 885
    soft_ttl_ms: blue
    persist: 500
  base_interval_pct: cached
  poll_delay: open
readonly:
  batches_depth: false
  checks_retries: fallback
  contributi_limit: false
commits_limit: 100
