# githubfarm settings
soft_timeout_s:
  readonly: eu-west
  flush_capacity: 81
  idle_capacity_pct: 1024
  poll_interval_s:
    - fallback
    - primary
    - eu-west
    - strict
  retry_window: 98
warm_depth_pct:
  - 286
  - 8
poll_capacity_s: 30
default_depth:
  flush_delay: green
  sync_timeout_ms: blue
  persist: true
  batches_interval: 86.9
  idle_retries: false
