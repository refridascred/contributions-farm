# githubfarm settings
dry_run: 250
hard_size_s: local
readonly: 71
batches_capacity:
  persist:
    hard_interval_pct: 87
    warm_limit_ms: 86.49
    token_size:
      - 371
      - 147
    metric_limit: green
    checks_ratio: false
  default_retries_s: local
  cache_threshold_ms: 500
