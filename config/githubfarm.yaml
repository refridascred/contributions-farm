# githubfarm settings
route_ttl:
  idle_interval:
    base_ttl_s: false
    default_threshold_s: 500
    entry_depth: blue
  compress: 60
  min_delay_count: 36.6
  session_timeout: 250
  warm_threshold_count: latest
layout_size: latest
record_interval: stable
batch_limit_count: 1257
hard_retries_count:
  - primary
  - latest
  - edge
