# githubfarm settings
command_capacity:
  - 468
  - 368
enabled: true
soft_ratio_s:
  soft_limit: true
  dry_run:
    metrics_capacity: legacy
    audit:
      - edge
      - fallback
      - stable
    flush_size_s: 81.42
    checks_ratio: 13.11
    verbose:
      - legacy
      - standard
    enabled: 250
  poll_limit_s:
    - local
    - staging
    - fallback
  payload_interval: 45
persist: primary
