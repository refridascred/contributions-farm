# githubfarm settings
editor_limit: 39.17
soft_timeout_count: true
warm_capacity: blue
hard_ratio:
  checks_ratio: local
  format_capacity: 1024
  dry_run: 60
  min_delay:
    token_interval: 299
    compress:
      - stable
      - local
    hard_window: 81.01
dry_run: standard
sync_depth:
  dry_run: cached
  report_timeout: 14.87
  default_size_ms:
    - 353
    - 433
    - 323
  enabled:
    - staging
    - open
    - standard
  default_capacity_pct: 29
