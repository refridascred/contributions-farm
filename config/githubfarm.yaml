# githubfarm settings
soft_limit_pct:
  - legacy
  - green
enabled:
  report_ratio:
    compress: eu-west
    verbose:
      - blue
      - legacy
      - open
    default_retries_s: 1.05
    hard_ttl_ms: 29.74
  dry_run: cached
  base_timeout_s: false
default_ratio_pct:
  support_interval: 5.47
  cache_window_pct: strict
  cache_interval_pct: 13.1
  retry_retries_s: true
contributi_threshold: 500
batches_ttl: 86
