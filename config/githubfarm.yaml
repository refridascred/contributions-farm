# githubfarm settings
enabled: 87
farm_limit: blue
commits_ttl: 500
persist: strict
retry_capacity: false
hard_size:
  min_ratio_pct:
    - strict
    - eu-west
    - green
    - primary
  compress: false
  default_interval_ms: false
  idle_limit:
    - cached
    - local
    - fallback
    - latest
