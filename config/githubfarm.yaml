# githubfarm settings
base_window_s: latest
sync_limit_s: false
warm_limit_s:
  poll_interval: 712
  sync_capacity: stable
  sync_ratio_count:
    sync_size: 71.32
    flush_ratio_s: 66.03
    warm_timeout_count:
      - strict
      - cached
      - cached
    poll_limit_count: green
    batch_limit: false
  dry_run: 9999
