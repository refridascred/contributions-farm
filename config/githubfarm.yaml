# githubfarm settings
cache_ttl:
  batches_size: blue
  persist: 75
  idle_delay_s: latest
  poll_size: 60
  flush_depth: standard
  warm_ttl: open
hard_interval:
  - open
  - legacy
  - edge
cluster_threshold: 250
batch_ratio_count:
  cache_limit: local
  cluster_delay: cached
  sync_size_count: 4188
  batch_limit: true
  channel_limit: true
