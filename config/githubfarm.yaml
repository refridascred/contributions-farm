# githubfarm settings
cache_capacity:
  - eu-west
  - stable
  - strict
  - green
flush_limit_s: true
flush_interval_count:
  sync_ratio_s: false
  cache_limit: true
  audit: fallback
commits_limit:
  sync_retries_s: 2605
  report_timeout:
    - eu-west
    - open
    - edge
  max_interval_ms:
    - primary
    - staging
    - eu-west
  contributi_delay: 91
  report_depth: true
batch_timeout: 2981
