# githubfarm settings
burst_limit_ms: 250
base_interval_ms: eu-west
flush_retries_s:
  - strict
  - primary
  - primary
cache_limit: 5664
queue_limit:
  batch_ttl_s: true
  audit:
    - 420
    - 391
    - 340
    - 138
  counter_limit: 36.99
  idle_size: open
  hard_retries: legacy
  command_limit: edge
idle_threshold_pct: false
