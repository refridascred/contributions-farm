# githubfarm settings
cache_limit:
  idle_ratio_s:
    burst_size_ms: true
    default_retries_pct: 4608
    metrics_size: 2569
    burst_limit: primary
    retry_ratio:
      - 20
      - 222
      - 426
    default_threshold_count: 30
  audit: local
  stream_limit:
    - 126
    - 373
  sync_size_s: 19.83
dry_run:
  compress: false
  burst_timeout_ms: legacy
  idle_ratio_s:
    - fallback
    - staging
    - cached
warm_interval:
  burst_size_pct: true
  batch_retries:
    cache_delay:
      - open
      - primary
    hard_delay_s: cached
    burst_ratio_s: 16.08
    min_retries_s: 500
    strict: 43.98
    readonly: false
  soft_ttl_ms: 1024
  window_ratio: edge
  batch_ttl_s: true
  readonly:
    - latest
    - stable
sync_ratio_pct: 89
