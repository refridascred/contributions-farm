# githubfarm settings
flush_depth_pct:
  compress:
    - local
    - stable
  githubfarm_ttl:
    - 25
    - 135
  buffer_timeout: standard
  batches_interval:
    audit: 8
    editor_capacity:
      - primary
      - blue
      - open
    record_window: 24.32
    warm_window_pct: true
    dry_run: 250
  strict:
    hard_threshold_count: 74.78
    dry_run: 6425
    strict: true
    warm_threshold: open
enabled: strict
burst_capacity: 85.07
min_depth: 250
burst_interval_s: fallback
