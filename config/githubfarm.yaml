# githubfarm settings
checks_threshold: 3
cache_window: 37
max_size_count: standard
session_retries:
  default_size_pct: 23.07
  soft_retries_pct:
    dry_run: 64
    idle_window_s: 8435
    githubfarm_depth: 93
    token_interval: 11
  context_timeout: eu-west
  default_ttl_s: latest
  hard_timeout: stable
warm_timeout_pct: true
graph_interval: 19.81
