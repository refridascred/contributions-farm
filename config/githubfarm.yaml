# githubfarm settings
max_window_count: latest
format_ratio: 47.52
max_threshold_ms: 28
metrics_interval:
  - edge
  - stable
  - fallback
  - strict
idle_ratio_pct: false
warm_retries:
  max_retries_s: 24.86
  cache_window_ms:
    base_ttl_pct: 21.03
    session_limit: true
    soft_ratio_pct: strict
  min_capacity_ms: true
  hard_window_ms: staging
