# githubfarm settings
readonly: false
compress: 92.46
flush_size_ms:
  compress:
    min_depth: standard
    min_delay: local
    persist:
      - standard
      - green
    hard_capacity_s: 52.81
    entry_timeout: 13
  enabled: true
  cache_limit_count: eu-west
  retry_size: 1048
hard_ttl_s:
  verbose: stable
  strict:
    - edge
    - staging
  max_interval_count:
    compress: 55
    batch_ttl: legacy
    burst_retries_s: true
    sync_ratio_s: strict
    verbose: staging
    support_size: 14
  metrics_window:
    - 14
    - 160
