# githubfarm settings
strict: standard
channel_retries:
  notes_interval: false
  enabled:
    - staging
    - eu-west
    - green
  min_timeout_s: eu-west
  contributi_size:
    - primary
    - primary
    - edge
    - primary
  batch_interval: stable
base_limit_pct: 36.08
sync_ttl_ms: 1024
max_size_count: 14.0
graph_ratio:
  - open
  - primary
  - blue
