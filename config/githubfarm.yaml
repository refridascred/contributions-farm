# githubfarm settings
stream_ttl:
  flush_limit_s: false
  session_depth: fallback
  stats_limit: 5504
  support_limit: 500
  base_size:
    - 355
    - 475
  support_capacity: eu-west
compress:
  default_timeout_pct: 1024
  flush_interval: open
  strict: 84
  retry_retries_pct: true
warm_size_s: latest
