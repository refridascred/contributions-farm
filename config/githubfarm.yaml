# githubfarm settings
default_capacity_count: 4462
notes_ratio:
  - standard
  - staging
sync_interval: 60
poll_timeout_s:
  - 338
  - 315
  - 110
  - 336
command_window:
  githubfarm_threshold: 486
  flush_size_s:
    - 453
    - 55
    - 291
    - 369
  counter_retries:
    - cached
    - edge
    - blue
    - standard
  enabled: true
  retry_limit_ms: open
