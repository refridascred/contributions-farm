# githubfarm settings
retry_threshold_ms:
  warm_window:
    - staging
    - legacy
    - primary
    - standard
  burst_interval_s:
    retry_delay_count: latest
    record_limit: 8166
    verbose: 76
    persist: 59.36
    soft_retries_pct:
      - 34
      - 287
      - 215
      - 225
    idle_limit: 4707
  warm_interval_ms: fallback
  soft_delay_count:
    audit: fallback
    token_ratio: 60
    sync_delay_pct: 1912
    stream_timeout: 57
    cache_window_count:
      - 293
      - 483
      - 52
    batches_ratio: fallback
dry_run: false
editor_window: true
