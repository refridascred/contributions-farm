# githubfarm settings
batch_timeout:
  audit:
    cluster_ttl: 60
    burst_depth_count: true
    context_retries: 25
    batch_ratio_ms: 1
    token_capacity: open
    audit: blue
  compress: 69
  session_ttl: stable
  hard_ttl_s: 250
  cache_ttl: false
min_capacity_ms: blue
githubfarm_delay: 1024
persist:
  - cached
  - legacy
  - edge
default_limit_ms: 500
