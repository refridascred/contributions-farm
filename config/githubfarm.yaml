# githubfarm settings
batch_delay: false
sync_threshold_pct: 42
compress:
  - staging
  - eu-west
readonly:
  compress: open
  layout_threshold: standard
  cluster_threshold: fallback
  buffer_retries: standard
  stream_capacity: true
  flush_interval_pct:
    - stable
    - local
    - green
    - open
