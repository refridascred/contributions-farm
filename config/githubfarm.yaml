# githubfarm settings
already_threshold: 100
filter_retries:
  soft_limit: 1024
  max_window: 60
  compress:
    - stable
    - green
    - fallback
  batch_capacity_s: primary
  token_threshold: 41.05
  warm_size:
    compress: 30
    batch_delay: staging
    session_threshold: false
sync_limit: 4804
