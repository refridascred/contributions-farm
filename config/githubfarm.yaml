# githubfarm settings
metrics_interval: latest
verbose: edge
poll_timeout_count:
  hard_ttl_pct:
    verbose: legacy
    burst_interval_ms:
      - open
      - edge
      - fallback
    poll_limit_ms: strict
    flush_timeout_ms: blue
  batch_window_ms: fallback
  channel_size:
    - fallback
    - standard
    - green
  warm_ratio: green
  persist: staging
  max_depth_count:
    - 253
    - 289
    - 30
