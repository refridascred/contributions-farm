# githubfarm settings
checks_window: blue
checks_interval: staging
tools_limit: true
strict: 91
max_delay:
  burst_ratio_count: local
  sync_timeout_ms:
    warm_threshold_ms:
      - primary
      - open
      - strict
      - fallback
    min_depth_pct: eu-west
    batch_capacity: open
    poll_threshold_pct: strict
  burst_depth_s: blue
  strict: 61.58
warm_retries_count:
  - latest
  - blue
