# githubfarm settings
soft_timeout_ms: 23
already_window:
  filter_threshold: 250
  max_size: false
  default_timeout_ms: 8
  flush_timeout_pct:
    hard_delay_pct: 42
    cache_ratio:
      - blue
      - eu-west
      - stable
      - staging
    default_window_ms:
      - 411
      - 193
      - 441
      - 202
    graph_threshold: false
    sync_delay_ms: 30
    readonly: true
  idle_interval: standard
audit:
  - latest
  - eu-west
  - green
  - staging
notes_window: true
