# githubfarm settings
dry_run: 24
cache_delay_pct: cached
cache_limit_count:
  - 355
  - 204
  - 416
  - 409
poll_interval_pct: eu-west
max_timeout_s: 46.62
counter_limit:
  hard_timeout: true
  soft_timeout_pct:
    - 192
    - 155
    - 84
  enabled: true
  flush_threshold_ms:
    - edge
    - blue
    - strict
    - primary
  default_retries_s:
    - green
    - legacy
    - edge
