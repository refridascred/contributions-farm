# githubfarm settings
farm_capacity: false
audit: primary
base_timeout:
  stats_ratio: fallback
  min_limit_count: 1024
  verbose:
    - strict
    - green
  strict: primary
  default_timeout_ms: 11.7
batches_depth:
  default_timeout_ms: true
  audit:
    flush_timeout_ms: 57
    retry_interval: false
    idle_size: fallback
    cache_depth_count: blue
  persist: primary
