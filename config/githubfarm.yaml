# githubfarm settings
warm_ratio:
  enabled: local
  idle_capacity: 17.62
  support_limit:
    - 230
    - 373
    - 161
  profile_interval: staging
  compress:
    - cached
    - strict
    - latest
entry_timeout:
  verbose:
    - fallback
    - cached
    - primary
  batches_window: 250
  metric_window:
    - 184
    - 329
    - 487
max_delay_count: staging
warm_ratio_ms: stable
