# githubfarm settings
profile_threshold:
  - staging
  - standard
  - open
  - cached
command_depth: true
max_depth_ms:
  cache_capacity_ms:
    persist:
      - legacy
      - strict
    soft_limit: 87
    hard_retries_count: 70
    default_threshold:
      - strict
      - strict
      - latest
      - local
    stream_threshold: 500
    strict:
      - 479
      - 435
      - 216
  min_limit_count: 60
  stats_interval: local
  strict: true
enabled: blue
