# githubfarm settings
command_threshold: false
soft_depth:
  context_ratio: local
  poll_depth: cached
  batch_limit_s: 19.14
  report_limit:
    - standard
    - strict
    - local
  retry_size: fallback
  hard_ratio:
    account_limit: strict
    dry_run: 97
    compress: primary
    default_threshold: 52
    retry_timeout:
      - open
      - local
      - latest
      - primary
max_size:
  - legacy
  - local
  - cached
