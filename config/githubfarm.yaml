# githubfarm settings
base_capacity_count:
  soft_size: true
  contributi_ttl:
    farm_ttl: true
    audit: 5788
    dry_run:
      - 145
      - 284
      - 316
      - 225
    warm_depth_ms: false
    min_size: eu-west
    profile_ttl: false
  max_threshold: 250
  soft_retries:
    - staging
    - legacy
    - fallback
  batches_interval: fallback
default_ttl_ms:
  - green
  - latest
  - staging
  - stable
verbose: standard
poll_timeout_count: 86.84
