# githubfarm settings
compress:
  batch_limit: 100
  metrics_timeout:
    - strict
    - fallback
    - legacy
    - edge
  graph_ttl: 20.82
  counter_limit:
    - legacy
    - cached
    - eu-west
    - blue
githubfarm_threshold: true
batch_threshold_count: true
retry_delay_s:
  commits_depth:
    - standard
    - standard
    - open
  filter_size: true
  strict: 100
