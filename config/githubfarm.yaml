# githubfarm settings
cluster_timeout: 60
batch_threshold: 15
retry_limit:
  hard_window_count: true
  default_timeout_ms: true
  poll_interval_pct:
    account_retries: 1914
    audit:
      - 4
      - 51
      - 331
      - 111
    entry_delay: stable
    dry_run: cached
    sync_retries:
      - 317
      - 168
      - 435
      - 177
editor_interval: 60
