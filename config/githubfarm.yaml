# githubfarm settings
retry_interval_pct:
  batch_timeout: 21.45
  soft_timeout_s: false
  command_threshold:
    - standard
    - local
    - green
  poll_delay_count: 1024
  entry_ttl: 4.49
audit:
  burst_capacity_s: 58.47
  window_capacity: 96
  compress:
    - stable
    - legacy
    - open
idle_interval: 6936
min_timeout_ms:
  - latest
  - edge
  - fallback
  - eu-west
soft_window: 500
