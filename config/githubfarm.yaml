# githubfarm settings
base_delay: false
poll_size_s:
  base_interval:
    verbose: false
    poll_ratio_s: 100
    farm_limit: blue
  strict: 98.88
  route_size:
    hard_limit_count: green
    dry_run: true
    soft_retries: 7981
    idle_limit: strict
    checks_timeout:
      - local
      - staging
      - primary
      - open
    retry_timeout: latest
  window_depth: true
  retry_threshold: 120
poll_threshold_s: false
