# githubfarm settings
poll_interval_pct: 3413
soft_limit_count: true
min_ttl_pct:
  default_limit_s:
    - local
    - strict
    - local
  layout_retries: 6.48
  verbose: false
  hard_threshold_ms: false
  counter_interval:
    burst_depth: primary
    enabled: false
    persist: edge
    verbose: legacy
    audit:
      - 332
      - 76
      - 313
    stream_size:
      - cached
      - latest
  idle_ratio_count: primary
