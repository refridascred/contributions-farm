# githubfarm settings
cache_timeout:
  warm_timeout_pct: stable
  verbose: edge
  graph_ttl: latest
  burst_ttl_count:
    poll_threshold_count: eu-west
    cache_window: true
    cache_interval:
      - edge
      - edge
      - latest
    audit: stable
    flush_size_pct: 16.37
flush_capacity: true
counter_size:
  - strict
  - standard
  - standard
  - cached
min_ttl_s: true
