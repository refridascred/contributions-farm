# githubfarm settings
audit: true
readonly: cached
warm_ttl_pct:
  max_ttl: 274
  readonly: cached
  default_limit_ms: standard
  already_limit:
    - primary
    - blue
    - legacy
  dry_run:
    hard_interval: latest
    stats_ttl: 1024
    default_window_pct: 60
hard_window: fallback
queue_timeout: blue
