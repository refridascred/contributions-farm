# githubfarm settings
layout_interval:
  - cached
  - green
cache_timeout_pct: primary
tools_retries:
  context_timeout: 1024
  warm_interval_count: 93.2
  soft_ttl_count: 35
  sync_interval: 500
  warm_retries:
    idle_capacity_s: standard
    sync_depth: 500
    base_size_count: 714
    profile_ratio: strict
    format_retries: false
