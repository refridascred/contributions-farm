# githubfarm settings
flush_window_ms:
  - primary
  - latest
queue_timeout:
  format_size: false
  warm_limit: 30
  profile_capacity:
    cluster_window: 250
    soft_retries_ms: 60
    graph_ttl: primary
  retry_window_s:
    readonly: 250
    cache_size: 1024
    verbose: false
    editor_ttl: local
    format_ttl: 32.15
  command_ratio: 69
  cache_timeout_ms: false
soft_capacity_s: true
