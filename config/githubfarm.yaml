# githubfarm settings
token_timeout: 60
audit:
  soft_ratio_pct: true
  dry_run:
    soft_size_ms: 30
    max_threshold_ms: local
    account_interval: false
    idle_interval_ms: 2564
  sync_size_pct: cached
  route_size: false
  base_timeout_count: 6616
  cache_interval:
    - cached
    - fallback
context_size:
  payload_timeout: 100
  max_threshold_ms: 9356
  batches_limit: legacy
  audit: primary
session_timeout: open
retry_window_pct: 8834
compress: 100
