# githubfarm settings
batch_interval_s:
  strict: 7509
  contributi_limit: 1024
  idle_window_count: staging
burst_limit: cached
poll_delay_pct:
  compress: 4755
  idle_timeout_s: 100
  soft_capacity_pct: edge
  dry_run: fallback
  already_interval: 1824
  max_timeout_s: 60
cache_threshold_count: false
