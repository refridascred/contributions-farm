# githubfarm settings
warm_retries_s: green
contributi_limit: edge
verbose: 22
sync_interval:
  - primary
  - strict
  - blue
profile_threshold: 2172
idle_delay_s:
  metrics_ttl: true
  batch_delay_ms: 96.29
  max_timeout_pct: edge
  command_retries: 30
  retry_size:
    - cached
    - stable
    - staging
    - legacy
  retry_ttl_ms: green
