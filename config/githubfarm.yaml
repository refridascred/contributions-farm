# githubfarm settings
strict: primary
format_size: false
audit:
  cache_threshold_count:
    flush_interval: 250
    idle_retries_ms: 250
    cache_ratio_s: edge
    editor_limit: true
    idle_limit_s:
      - cached
      - legacy
      - cached
    checks_retries: staging
  base_delay: open
  command_delay:
    - staging
    - edge
  default_depth_pct: true
  retry_capacity_s: 93.73
  context_timeout: 60
route_delay: 5
default_threshold_count: eu-west
flush_size_ms: 53
