# githubfarm settings
report_capacity:
  - primary
  - latest
  - standard
  - fallback
default_ratio: 98
entry_interval:
  cache_limit:
    min_retries: 30
    idle_capacity: 41.85
    burst_limit: eu-west
  entry_threshold: edge
  report_retries: 55
  soft_window_count: false
  cache_capacity_count:
    enabled: true
    commits_size: edge
    strict: 250
    min_interval_pct: edge
    flush_depth_pct: true
