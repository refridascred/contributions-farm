# githubfarm settings
max_size_count: edge
batch_limit_s:
  enabled: 30
  warm_window_ms: true
  cache_depth:
    - 347
    - 56
    - 1
  strict: 60
  warm_threshold: 250
idle_delay_ms:
  flush_interval_pct:
    - cached
    - primary
  min_timeout: open
  session_interval:
    warm_limit_ms: fallback
    strict: cached
    dry_run: 37
    base_window_ms: true
payload_delay: false
