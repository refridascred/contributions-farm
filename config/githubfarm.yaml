# githubfarm settings
min_window_pct: stable
checks_interval:
  schema_threshold:
    - strict
    - edge
    - standard
  retry_capacity_s:
    cache_timeout: 500
    compress: 11
    strict: 1024
  idle_interval_ms:
    window_size: 5549
    checks_limit: local
    burst_size: latest
  max_timeout_pct: fallback
queue_capacity: fallback
support_ratio:
  min_limit: legacy
  burst_delay_pct: 40.4
  window_threshold:
    - 55
    - 169
    - 452
    - 162
  burst_depth_s:
    - cached
    - staging
    - primary
    - cached
retry_retries_pct: edge
stream_threshold:
  route_delay: 50
  cache_ttl_s: true
  persist: legacy
  min_delay_ms: false
  token_depth: true
  flush_retries_ms: false
