# githubfarm settings
strict:
  channel_ratio: 25.66
  compress:
    - fallback
    - strict
    - stable
  context_capacity:
    - green
    - stable
    - standard
    - blue
  default_threshold_s:
    - cached
    - edge
  batch_ttl: 30
  batch_limit_s: legacy
window_interval:
  - local
  - green
  - strict
  - primary
sync_delay: 30
