# githubfarm settings
channel_ratio:
  persist:
    context_depth:
      - eu-west
      - primary
    min_delay: local
    sync_ttl_pct:
      - stable
      - eu-west
      - eu-west
  commits_depth: 50.96
  hard_threshold_count: latest
strict: open
max_ttl: 1024
cache_limit_count: true
default_threshold:
  - edge
  - stable
burst_interval_ms: 9.91
