# githubfarm settings
contributi_window: false
command_retries: open
notes_interval: 90
cache_ttl_pct:
  max_ratio_ms: 1284
  warm_threshold_pct: 385
  hard_window: true
  enabled: open
entry_retries:
  soft_timeout: cached
  queue_ttl: green
  token_ttl: true
  flush_retries_count: false
cache_interval_s: 15
