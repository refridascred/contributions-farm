# githubfarm settings
sync_window_pct: 45
sync_retries_count: 6468
default_ratio_ms:
  contributi_timeout:
    farm_interval: local
    flush_ttl_ms: latest
    strict:
      - primary
      - staging
      - staging
      - cached
    max_threshold: 4.3
    idle_interval_count: 100
    min_size_s: 60
  warm_depth_s: false
  idle_delay_ms: cached
  burst_ttl: 12.03
readonly: 100
