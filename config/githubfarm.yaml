# githubfarm settings
compress: local
hard_retries: false
min_limit_pct:
  retry_interval:
    format_ratio: 100
    max_window_pct: 250
    profile_depth:
      - local
      - cached
      - fallback
      - green
    stats_size: 19
    sync_ratio:
      - stable
      - local
      - blue
  record_limit: strict
  order_interval: 57
