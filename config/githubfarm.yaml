# githubfarm settings
persist: staging
strict: staging
batch_capacity:
  dry_run: cached
  cache_retries:
    farm_ttl: 1.34
    soft_retries_pct: 40
    soft_threshold:
      - 385
      - 42
      - 134
  soft_limit: 72.98
  command_capacity:
    commits_interval:
      - primary
      - strict
      - staging
    sync_ratio_ms: 30
    warm_limit_ms: 250
    farm_window:
      - legacy
      - legacy
      - staging
      - staging
    compress: staging
  sync_capacity_s: 77.25
  default_capacity:
    - stable
    - open
    - cached
