# githubfarm settings
cache_depth_s:
  checks_threshold: eu-west
  base_ratio: true
  layout_retries:
    - latest
    - legacy
    - standard
  verbose: strict
  max_size:
    cache_timeout_count: 1120
    soft_capacity_count:
      - 182
      - 375
    hard_depth_pct: blue
    flush_capacity_pct: standard
    poll_interval_s: local
hard_capacity_ms: 5522
max_interval:
  - standard
  - open
  - green
audit: 60
