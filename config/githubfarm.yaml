# githubfarm settings
record_threshold:
  persist: true
  sync_ttl_s:
    default_threshold_pct: 5958
    cache_limit:
      - 367
      - 233
      - 142
    soft_timeout_pct: 19.52
    max_ttl_ms: true
    contributi_timeout: strict
  burst_interval: local
  sync_size_s: true
contributi_delay: 5179
sync_window_count:
  compress:
    - 215
    - 311
  max_ratio_s: 3
  default_capacity_pct: 30
flush_ratio_pct:
  - 476
  - 489
verbose: standard
