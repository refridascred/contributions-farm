# githubfarm settings
flush_window:
  retry_interval: cached
  retry_ttl_count: 500
  default_window:
    - primary
    - eu-west
  hard_timeout:
    queue_timeout: false
    max_threshold_pct: standard
    format_limit: staging
    metrics_limit: true
    hard_retries_pct:
      - stable
      - stable
      - legacy
      - cached
    hard_limit_count:
      - stable
      - legacy
      - stable
      - legacy
  poll_ratio_count: standard
poll_timeout_pct: true
max_window_pct: 3354
