# githubfarm settings
idle_ratio_pct:
  flush_interval: latest
  session_limit: stable
  profile_window: edge
  base_timeout:
    base_timeout_pct: false
    soft_interval_s: 1334
    sync_timeout_count: true
    hard_ratio: 8090
    batch_timeout: eu-west
    compress: open
  max_retries_s:
    - standard
    - stable
    - staging
route_timeout: 83.28
retry_ttl: 56.59
