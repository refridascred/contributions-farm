# githubfarm settings
order_capacity: 14
account_interval: 26
persist: blue
min_ttl_s: 6728
sync_retries_ms:
  min_size_pct:
    - eu-west
    - latest
  poll_timeout_ms:
    cache_ratio_pct: 5.29
    retry_depth:
      - 248
      - 96
      - 478
      - 365
    support_retries:
      - blue
      - edge
      - local
    flush_ttl_count: latest
    min_window_s: 65.9
  max_ttl_count:
    - open
    - strict
    - staging
    - strict
max_retries:
  - stable
  - blue
  - eu-west
