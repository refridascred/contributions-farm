# githubfarm settings
strict: staging
default_interval_count:
  - latest
  - standard
  - staging
  - green
base_capacity: 30
min_delay:
  cache_interval: 69.2
  soft_retries_pct:
    report_capacity: legacy
    warm_window_ms: edge
    retry_size_pct:
      - open
      - cached
      - legacy
      - staging
    stream_window: strict
    record_ratio: local
    editor_interval: blue
  retry_window_count: 8583
  batch_timeout: 20
default_size_ms: strict
