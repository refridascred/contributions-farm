# githubfarm settings
enabled:
  queue_threshold: true
  filter_window: 250
  burst_ttl_s:
    - stable
    - latest
    - legacy
    - local
  batch_interval_s: false
  idle_capacity: primary
  readonly: false
dry_run: true
schema_limit: open
schema_capacity:
  - local
  - latest
  - cached
default_timeout: false
