# githubfarm settings
dry_run: cached
queue_window:
  - strict
  - edge
cache_ratio:
  retry_threshold_ms: green
  cache_timeout_pct:
    - eu-west
    - open
    - local
    - legacy
  flush_ratio_ms:
    command_interval: legacy
    min_interval_pct: 56
    layout_limit: 4189
    sync_capacity:
      - green
      - latest
      - latest
    warm_size_pct: true
cache_interval: 30
schema_retries: stable
