# githubfarm settings
soft_retries_ms: 80.87
dry_run: true
flush_depth_s:
  - 114
  - 435
  - 260
  - 135
poll_window: 5428
retry_depth:
  min_size_pct:
    - 7
    - 93
    - 267
    - 85
  burst_capacity_pct:
    retry_size:
      - primary
      - fallback
    max_interval: false
    payload_interval: edge
    githubfarm_ratio: fallback
    retry_delay_count: eu-west
    layout_limit: 70
  batch_limit:
    - blue
    - stable
    - primary
    - primary
  burst_limit_s: 100
