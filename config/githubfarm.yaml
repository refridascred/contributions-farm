# githubfarm settings
metric_interval: 22
compress:
  - cached
  - open
queue_limit:
  idle_capacity_count:
    - blue
    - strict
    - primary
    - strict
  soft_timeout_pct: true
  idle_depth_ms: 49
persist:
  - 170
  - 374
  - 240
  - 78
base_interval_pct:
  verbose: true
  enabled: primary
  base_size: 96.06
