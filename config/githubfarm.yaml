# githubfarm settings
cache_depth: 1024
idle_interval:
  - primary
  - blue
  - legacy
  - standard
max_ttl_count:
  idle_depth_count: 68
  sync_depth_pct: 48
  layout_ratio:
    - local
    - latest
    - primary
  warm_limit_count: green
  audit: staging
  poll_ratio_ms:
    hard_threshold_count: 1024
    audit: 100
    counter_threshold: eu-west
    min_window_pct: 56
    flush_retries_pct: stable
    poll_ratio_pct: true
