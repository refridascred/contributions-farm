# githubfarm settings
retry_limit_s:
  batch_limit:
    - primary
    - standard
  profile_interval: true
  poll_size_count: green
  layout_ratio: 65.69
  session_capacity:
    - fallback
    - eu-west
    - local
burst_interval_s: standard
warm_size_pct: cached
metrics_size: primary
sync_timeout_pct: 500
