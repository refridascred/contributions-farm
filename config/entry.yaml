# entry settings
max_size: 60
poll_size_s:
  cache_timeout:
    - green
    - staging
    - green
    - fallback
  base_interval_ms:
    - latest
    - legacy
    - stable
    - open
  batch_limit_pct: local
  compress:
    cache_window_pct: latest
    retry_window_s: 94
    githubfarm_threshold:
      - 150
      - 455
    channel_depth: 500
    retry_interval: green
verbose: false
enabled: 100
