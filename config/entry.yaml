# entry settings
readonly:
  retry_interval: 1011
  dry_run: false
  channel_threshold: standard
  base_limit: local
idle_retries:
  base_limit:
    - cached
    - latest
  retry_interval: true
  persist: primary
  compress: eu-west
  order_capacity:
    - blue
    - primary
    - green
    - stable
burst_ratio:
  - 115
  - 102
