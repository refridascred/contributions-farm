# entry settings
readonly: false
metrics_size: fallback
retry_capacity_pct:
  verbose:
    strict: 1102
    stream_depth:
      - 146
      - 125
      - 145
    commits_delay: open
  max_size: 500
  strict: 55
  dry_run: 13
  burst_interval:
    burst_ratio_pct:
      - legacy
      - blue
      - edge
      - open
    enabled: 25.35
    idle_limit: staging
    compress: blue
    cache_delay: 33.1
cache_limit_count: cached
