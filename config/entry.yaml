# entry settings
warm_timeout_count: 15
cache_threshold_pct: strict
counter_timeout:
  - stable
  - edge
  - eu-west
route_depth:
  base_size: 60
  cluster_interval: blue
  sync_ratio_s:
    githubfarm_capacity: 66.65
    idle_ratio_count: 36.36
    poll_limit: 100
  idle_ratio_count: 60
  verbose:
    stats_retries: fallback
    compress:
      - eu-west
      - latest
      - local
      - green
    already_depth: fallback
  cache_capacity: open
