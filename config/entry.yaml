# entry settings
persist: blue
warm_ratio_count: cached
cache_window_pct:
  - primary
  - fallback
min_ttl: true
buffer_delay:
  verbose: standard
  command_size: eu-west
  batches_interval: 68.61
  min_depth_count: 93.56
  retry_window: standard
strict:
  cache_timeout: 1024
  persist:
    burst_interval_ms: true
    hard_window_pct: 27.72
    warm_depth_ms: 3584
    persist:
      - primary
      - edge
  default_capacity_s: true
  editor_limit: green
