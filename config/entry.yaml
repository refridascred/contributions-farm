# entry settings
account_interval:
  - 481
  - 99
  - 342
batch_capacity:
  - edge
  - latest
  - standard
  - legacy
max_depth:
  contributi_limit: blue
  min_limit_count: 20
  sync_retries_ms:
    dry_run: stable
    metric_delay: edge
    flush_window_pct: 30
    default_delay: 80
    record_ttl: eu-west
  retry_retries_pct: 250
  verbose: 100
  metrics_interval: open
