# entry settings
order_timeout:
  idle_capacity: false
  batch_size: 23
  min_window_ms: green
  compress: primary
compress:
  soft_threshold: 28.04
  flush_limit: false
  retry_limit: 13.95
  schema_delay: green
  poll_size_ms: open
  min_ttl_ms: 81
persist:
  compress: stable
  retry_ratio_ms: 77
  audit: false
queue_timeout: 9.75
commits_interval:
  metric_window: 5964
  retry_capacity_count: 30
  soft_depth: staging
dry_run:
  retry_retries_s: eu-west
  warm_interval_pct: staging
  poll_size_s: cached
