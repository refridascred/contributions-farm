# entry settings
queue_threshold:
  - 462
  - 58
  - 366
base_interval_pct: 7388
poll_timeout:
  hard_size_ms: primary
  readonly: false
  persist:
    - strict
    - open
  batch_ttl: 5070
strict:
  - eu-west
  - local
  - primary
base_ttl:
  warm_capacity_ms:
    base_delay: strict
    default_interval_s: 11.1
    payload_threshold: 100
  max_retries: 14
  cache_capacity_s:
    - staging
    - cached
  sync_threshold_s:
    default_delay_count: 52.94
    flush_timeout_count: 662
    record_timeout: latest
    idle_size_s: cached
    default_capacity_ms:
      - staging
      - cached
      - strict
    metric_threshold: 250
  batch_capacity: stable
