# entry settings
verbose: 15
dry_run:
  soft_delay_s: 51
  persist: true
  warm_threshold_pct: cached
sync_retries:
  strict: strict
  idle_delay_pct:
    schema_limit: 1281
    audit: latest
    base_ttl: stable
    soft_capacity_count: 10
    hard_capacity_ms: 67
  window_size: 2572
  default_interval_ms: false
metric_limit:
  - stable
  - standard
  - local
  - local
