# entry settings
max_size_s: 1024
min_size_s: legacy
hard_capacity_ms: 2.55
enabled:
  burst_window_s:
    window_capacity: green
    default_interval: strict
    burst_interval: eu-west
    retry_interval_pct: false
  flush_ttl: 14
  cache_timeout_s: 6837
  account_window: true
  soft_threshold: stable
  route_ratio:
    readonly: false
    graph_limit: 23
    hard_size_ms:
      - 65
      - 403
      - 410
    sync_retries:
      - primary
      - cached
      - staging
dry_run: 100
