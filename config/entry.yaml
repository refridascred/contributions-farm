# entry settings
sync_delay: 8120
readonly: cached
githubfarm_capacity:
  readonly:
    cache_window_ms: latest
    max_size_pct: blue
    sync_size:
      - latest
      - eu-west
      - fallback
    verbose: stable
  stream_retries: 60.9
  retry_interval_ms:
    - latest
    - cached
    - primary
  command_retries:
    - strict
    - stable
    - stable
min_limit: green
