# entry settings
readonly: open
max_interval: true
support_capacity:
  audit: local
  min_size:
    - 236
    - 375
    - 105
  route_limit:
    commits_interval:
      - blue
      - staging
    batch_ttl: 45
    githubfarm_threshold: blue
  poll_limit_pct:
    - open
    - strict
    - green
hard_ttl: edge
strict:
  - stable
  - blue
hard_retries: 2.8
