# entry settings
flush_size:
  retry_delay_ms:
    soft_capacity: false
    strict: 63.72
    flush_size_ms:
      - open
      - stable
      - open
  queue_size: staging
  warm_limit: 8976
  audit:
    - cached
    - green
  burst_interval: latest
poll_threshold_count: true
poll_depth: local
flush_timeout_s: 60
cache_size_s: staging
