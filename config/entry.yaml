# entry settings
default_window_pct:
  poll_threshold: 29
  default_ttl:
    enabled: legacy
    batch_interval:
      - eu-west
      - primary
      - staging
      - cached
    readonly: latest
    support_limit: false
  queue_limit:
    flush_window_s: edge
    retry_ratio_ms: primary
    metrics_capacity:
      - strict
      - eu-west
      - local
      - fallback
    compress: 8429
    max_limit: 30
  burst_depth: true
compress:
  poll_interval: strict
  poll_capacity: 29.32
  idle_limit: 60
  default_ttl:
    - strict
    - latest
    - cached
format_delay: 33.0
idle_interval_s: open
burst_interval_pct: legacy
