# entry settings
flush_ratio_pct:
  flush_threshold_pct: true
  idle_ratio_count: latest
  context_size:
    - 492
    - 106
    - 303
    - 298
report_interval:
  readonly:
    schema_timeout: 58
    retry_limit_ms: blue
    max_limit: 5801
