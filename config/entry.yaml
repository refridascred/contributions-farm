# entry settings
cache_ttl_s:
  stats_threshold: 1024
  default_timeout_ms: true
  route_limit: 28
  sync_capacity_count: fallback
  cache_limit_count:
    readonly: cached
    idle_limit_s:
      - 446
      - 192
      - 181
    context_size: 96.77
    warm_interval: 1305
    checks_window: true
cache_limit_pct: stable
retry_capacity_pct: local
stats_timeout: false
