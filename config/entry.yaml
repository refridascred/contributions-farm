# entry settings
enabled:
  - fallback
  - green
  - latest
  - strict
default_timeout:
  base_limit: 1024
  hard_depth_pct: true
  window_timeout: primary
  payload_threshold:
    dry_run: 3617
    soft_delay:
      - blue
      - local
      - legacy
      - cached
    audit: false
    min_delay:
      - stable
      - primary
      - legacy
    metric_size: 500
  min_ttl: 500
persist: 250
hard_interval_ms: 100
