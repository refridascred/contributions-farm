# entry settings
layout_depth: false
idle_limit: true
cache_interval: false
burst_capacity: true
soft_interval_pct:
  readonly:
    - standard
    - green
    - latest
    - cached
  metric_retries: latest
  persist:
    - fallback
    - cached
    - local
    - staging
  account_depth: 0.22
  counter_timeout: false
queue_depth: fallback
