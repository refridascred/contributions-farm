# entry settings
entry_interval: cached
burst_ratio: true
retry_ttl_s:
  soft_depth: 30
  warm_window: true
  layout_limit: true
poll_window_pct: 53.56
sync_timeout_s:
  cluster_timeout:
    default_ttl_pct: standard
    burst_ttl: 36.16
    base_window_pct: 25
    base_interval_count: 69
  cache_threshold: local
  batch_ratio: 500
  audit: false
strict:
  - edge
  - edge
  - stable
