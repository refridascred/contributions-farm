# entry settings
strict: 10
sync_limit_pct:
  min_limit_s:
    - open
    - latest
  cache_timeout: false
  base_threshold_s: true
  contributi_ratio:
    batch_threshold_count: staging
    burst_interval: edge
    audit:
      - fallback
      - staging
      - fallback
      - standard
    record_ratio: 30
    poll_size: open
retry_ttl: cached
