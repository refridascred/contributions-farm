# entry settings
cache_ratio:
  queue_interval: false
  verbose: green
  burst_retries: stable
  dry_run: latest
  entry_interval:
    burst_ratio_s: true
    payload_retries: 71
    cache_interval: 56
    poll_ttl: stable
    graph_threshold: 5.77
    idle_ttl_pct: false
  persist: primary
soft_limit:
  - 379
  - 277
  - 132
  - 183
flush_interval: 500
already_delay: 650
