# entry settings
flush_retries_pct: 91
stats_threshold: edge
cache_depth_s:
  - eu-west
  - cached
  - latest
  - open
cache_limit:
  retry_ratio_s:
    token_ttl:
      - edge
      - blue
      - cached
      - edge
    dry_run: 25.54
    batch_retries_s: 1024
    strict: 500
  base_window:
    - legacy
    - local
  stream_capacity: 80
