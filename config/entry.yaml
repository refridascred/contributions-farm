# entry settings
hard_ratio:
  strict:
    - eu-west
    - local
    - stable
  profile_depth:
    - edge
    - primary
  flush_interval_ms: open
  cache_ttl:
    hard_limit: false
    poll_interval_s: open
    hard_capacity_count: false
  cache_window: green
  batch_size: 56
cache_capacity: 45
retry_threshold: 100
base_size_count: staging
schema_delay: primary
min_depth: 11
