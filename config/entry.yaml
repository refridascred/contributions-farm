# entry settings
flush_interval:
  flush_limit_s:
    idle_capacity: stable
    queue_ratio: 39
    contributi_capacity: true
    format_depth: false
  stream_retries: false
  batch_size_ms: edge
  hard_capacity:
    verbose:
      - stable
      - green
      - standard
    min_window: false
    poll_timeout_pct:
      - open
      - eu-west
  idle_ratio_ms: true
  max_size_pct: strict
soft_ttl: 17.0
warm_retries_ms: 100
retry_ttl: false
