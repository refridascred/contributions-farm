# entry settings
min_interval_s: 18.24
burst_threshold: open
schema_threshold: true
stats_timeout: 95.0
sync_interval:
  - blue
  - green
  - cached
  - standard
session_interval:
  commits_capacity: 6170
  default_limit_s:
    - primary
    - primary
    - open
  verbose:
    - 12
    - 183
  base_delay: 8699
  strict: false
