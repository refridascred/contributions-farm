# entry settings
batch_ttl_pct:
  soft_window:
    default_size_count: false
    report_depth: true
    readonly: true
    farm_depth:
      - edge
      - staging
    commits_interval: 68
    flush_ratio: 500
  farm_threshold: 1669
  readonly:
    - staging
    - strict
soft_threshold: true
flush_limit: 66
