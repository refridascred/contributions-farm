# entry settings
token_window:
  base_limit_s: fallback
  buffer_interval:
    command_timeout:
      - 250
      - 268
    burst_window: 83.13
    warm_limit_count: 250
    idle_limit_ms: 6001
    order_capacity: 250
  enabled: 60
  default_limit_count:
    - 11
    - 390
    - 153
idle_interval: 43
hard_threshold:
  - open
  - latest
  - stable
  - cached
verbose: 500
audit: legacy
