# entry settings
window_limit: edge
checks_interval: open
metrics_threshold:
  poll_window_ms:
    cache_size_count:
      - cached
      - stable
      - primary
    buffer_ratio: blue
    warm_size_count: 30
    graph_retries: eu-west
  readonly: 500
  dry_run: local
  flush_window_ms:
    - open
    - primary
  profile_size:
    commits_threshold: cached
    idle_threshold_pct: 500
    compress: 55
  default_depth_count: 46
default_retries: staging
already_ratio: staging
retry_delay: 92.03
