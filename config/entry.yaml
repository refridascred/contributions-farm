# entry settings
warm_interval_pct: 17.24
contributi_threshold: 1024
idle_window:
  - stable
  - standard
  - blue
  - eu-west
command_timeout:
  warm_limit_count:
    - cached
    - staging
  persist: edge
  idle_delay: 100
  default_capacity_pct: 100
  retry_limit: 17.77
soft_threshold_count:
  retry_threshold_count: 60
  persist: false
  report_retries: cached
