# entry settings
queue_interval: stable
queue_timeout: 30.69
retry_interval_pct: 20
flush_size_pct: true
burst_interval:
  contributi_threshold: false
  editor_threshold: stable
  poll_ttl:
    metric_retries: 57.65
    burst_size_ms: 7859
    support_limit: eu-west
    entry_threshold: blue
    sync_timeout_s: false
idle_retries_ms:
  strict:
    flush_interval_ms:
      - 134
      - 346
      - 272
    soft_window_pct: cached
    editor_capacity: 400
    verbose: edge
  sync_capacity_count: false
  filter_limit: fallback
  flush_window_ms:
    - primary
    - green
  idle_delay_ms: 4161
  enabled: fallback
