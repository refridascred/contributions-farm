# entry settings
buffer_limit:
  default_capacity: 79.87
  batch_ttl: 16
  schema_window: 23
base_timeout_count: local
default_interval_pct: 73
soft_timeout_count:
  enabled: cached
  max_size: false
  flush_ratio: 100
  cache_size_count:
    audit: legacy
    flush_threshold_pct: primary
    batch_size_s: 1024
    default_delay_count: 60
    notes_limit: 69
  readonly: cached
window_threshold:
  - green
  - open
  - cached
checks_delay: 23
