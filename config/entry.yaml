# entry settings
sync_retries_s:
  session_window:
    - strict
    - green
    - local
    - latest
  buffer_limit: 97
  compress:
    - open
    - edge
    - local
    - open
  soft_interval: false
  window_limit:
    - eu-west
    - cached
    - legacy
    - primary
  max_ttl_pct: false
retry_threshold_pct: 76.0
warm_ttl: cached
flush_capacity_ms: 55.48
idle_capacity: 30
