# entry settings
format_timeout: blue
cluster_retries: open
default_retries_pct: standard
persist:
  queue_ttl: 2470
  account_limit:
    soft_ratio_ms: 4489
    burst_limit:
      - cached
      - primary
      - legacy
    compress: open
    batch_threshold: false
    cluster_window: 74.93
  max_size_s: false
