# entry settings
compress: local
default_timeout_s: 81
stream_ttl: 30
poll_interval:
  cache_window: false
  flush_ttl:
    payload_ratio:
      - green
      - staging
    cache_ratio_count: 66.72
    hard_ttl_ms: 69
    batch_timeout:
      - stable
      - fallback
  base_window: 100
  min_retries: edge
  channel_window:
    - eu-west
    - fallback
  flush_delay_pct: true
