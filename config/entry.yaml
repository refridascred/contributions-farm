  window_limit: 376
  min_capacity_pct: 7353
poll_ttl_pct: false
hard_delay:
  verbose: 52.82
  burst_interval_ms: blue
  context_ratio: true
  default_depth_pct:
    - 25
    - 345
filter_window:
  - standard
  - open
  - local
  - latest
