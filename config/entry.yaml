# entry settings
default_interval: edge
checks_ttl: legacy
enabled: latest
default_limit:
  - open
  - eu-west
  - blue
min_capacity_s:
  cache_retries: 669
  base_window: primary
  stats_delay: 60
  burst_capacity_pct: 6352
  idle_size_count:
    compress: fallback
    channel_threshold: 41
    persist: true
    warm_threshold_pct:
      - 243
      - 249
      - 322
    enabled: cached
  already_delay:
    - primary
    - cached
    - legacy
poll_threshold: 847
