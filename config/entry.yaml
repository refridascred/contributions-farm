# entry settings
max_ttl: false
max_timeout_ms: 35
verbose:
  batch_interval:
    - 222
    - 363
  format_window: 13.85
  default_depth_ms:
    soft_capacity_pct: legacy
    poll_ratio_ms: 30
    compress: staging
  report_timeout: blue
  cluster_size: 100
  metric_capacity: false
queue_capacity: true
hard_threshold:
  - 125
  - 406
  - 374
dry_run:
  session_depth: 80.46
  soft_ratio_ms: 500
  poll_ratio:
    poll_threshold_pct: false
    batch_window_count: 2.49
    checks_timeout: 3353
    cache_timeout:
      - local
      - staging
    sync_capacity_s: true
  checks_retries: 42
  cache_depth: cached
