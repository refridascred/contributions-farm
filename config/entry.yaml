# entry settings
cache_window_s:
  - primary
  - local
base_depth: local
idle_ttl: 1024
idle_capacity_count:
  sync_limit_ms: false
  stream_timeout: true
  command_size:
    idle_capacity_count: latest
    readonly: 6554
    sync_threshold_s:
      - strict
      - cached
      - blue
      - fallback
    max_ratio_ms: false
    verbose: open
