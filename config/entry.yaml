# entry settings
dry_run:
  - strict
  - local
  - blue
persist: 250
default_capacity_count: 7314
route_depth:
  sync_limit: false
  max_threshold_s: standard
  context_ttl: 8
  strict: cached
  persist:
    poll_capacity: 96.92
    metric_interval: primary
    tools_delay:
      - latest
      - strict
    persist: true
  base_threshold: fallback
