      - 195
      - 300
    poll_delay_count: false
    editor_ratio: open
    max_timeout: cached
  strict:
    cache_timeout: blue
    githubfarm_ttl: 90.97
    flush_limit: 3.51
  queue_size: 30
sync_interval_s:
