# entry settings
audit:
  base_interval: primary
  persist:
    - eu-west
    - blue
    - eu-west
    - edge
  batch_depth:
    burst_interval: 18.51
    min_delay_count: 100
    flush_window_s: 2.03
    readonly:
      - staging
      - stable
idle_timeout_pct: 67
burst_timeout_ms: 100
compress: 500
