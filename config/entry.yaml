# entry settings
default_retries_s: true
soft_delay: 71
default_limit:
  account_ttl:
    max_timeout_ms: true
    readonly: open
    notes_ttl: 60
  compress: 11
  enabled:
    - fallback
    - blue
    - local
    - latest
  flush_size_count: 8728
  cache_interval: 61
  burst_depth_pct: true
sync_window:
  - green
  - cached
  - legacy
