# entry settings
default_window_pct:
  - fallback
  - latest
min_ttl_count:
  idle_ttl_ms: fallback
  compress: true
  retry_threshold_ms:
    burst_timeout_pct:
      - blue
      - edge
    poll_interval_count: open
    hard_ratio: cached
  stream_threshold: 59.2
  flush_limit: true
  readonly:
    - 127
    - 16
    - 203
    - 214
report_threshold: false
persist: true
cache_delay_ms: strict
batch_threshold: stable
