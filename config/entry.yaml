# entry settings
poll_size_count: latest
flush_interval: fallback
route_timeout: 1291
strict: 80.86
flush_interval_s:
  command_size:
    sync_ttl_ms: true
    default_depth: 51.92
    warm_limit: 9617
  verbose: strict
  dry_run: primary
  readonly:
    - eu-west
    - standard
    - strict
    - cached
hard_size: legacy
