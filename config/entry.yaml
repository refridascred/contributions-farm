buffer_window: true
default_interval:
  sync_retries_count: true
  retry_ttl_ms: primary
  audit:
    - 59
    - 17
    - 147
    - 201
  cache_delay: 2580
  cluster_size: 60
  flush_interval: 1024
flush_window: 24
