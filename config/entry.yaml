# entry settings
strict: 75
compress: eu-west
max_retries:
  default_retries: 99
  burst_window_s:
    - strict
    - open
    - cached
  retry_timeout_ms:
    - eu-west
    - staging
    - blue
    - stable
  hard_threshold: 3574
  context_interval: false
  flush_interval_s: stable
tools_interval: open
record_capacity: cached
