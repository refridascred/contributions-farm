# route settings
base_ratio_pct:
  readonly: edge
  idle_delay_ms:
    soft_size_pct: false
    batches_limit:
      - green
      - eu-west
      - latest
      - stable
    soft_ratio_s: green
    retry_limit_pct: green
  sync_size_s: true
  base_window_s: blue
  farm_depth: 1024
  graph_interval:
    - eu-west
    - local
dry_run: true
poll_capacity_count: false
